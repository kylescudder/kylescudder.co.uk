name: CI
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Typecheck, build and check formatting
        run: |
          docker run --rm -e HUSKY=0 -e CI=true -e ASTRO_TELEMETRY_DISABLED=1 -e BUN_CONFIG_MAX_HTTP_REQUESTS=8 -v "$PWD:/app" -w /app oven/bun:1.4.4@sha256:1d22548f177f4ff38e0c15baa3c2c46c6c2060ba2d1bc573bb4720b407548f1d sh -c 'bun install --frozen-lockfile && bun run typecheck && bun run build && bun run format:check'
      - name: Test deployment hooks
        run: python3 -B -m unittest discover -s deploy -p 'test_*.py'
      - name: Test webhook receiver
        run: node --test deploy/receiver/server.test.mjs
      - name: Build and start production image
        run: |
          docker build -t kylescudder-site:ci --build-arg PORTFOLIO_REVISION="$GITHUB_SHA" .
          PORTFOLIO_IMAGE=kylescudder-site:ci docker compose -f compose.yaml config --quiet
          docker network create platform-web
          trap 'PORTFOLIO_IMAGE=kylescudder-site:ci docker compose -f compose.yaml down; docker network rm platform-web' EXIT
          PORTFOLIO_IMAGE=kylescudder-site:ci docker compose -f compose.yaml up -d --wait --wait-timeout 60
          docker exec kylescudder-site-kylescudder-site-1 wget -qO- http://127.0.0.1:8080/healthz | grep -qx "{\"ok\":true,\"revision\":\"$GITHUB_SHA\"}"
          for path in / /work/ /redesigns/ /CV.pdf; do
            docker exec kylescudder-site-kylescudder-site-1 wget -qO /dev/null "http://127.0.0.1:8080$path"
          done
          status=$(docker exec kylescudder-site-kylescudder-site-1 wget -S -O - http://127.0.0.1:8080/missing-page 2>&1 || true)
          echo "$status" | grep -q '404 Not Found'
